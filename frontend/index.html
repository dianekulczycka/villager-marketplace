<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml"
          href="https://res.cloudinary.com/exku39jb/image/upload/v1785770995/village_ugkk6u.webp"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title> Village </title>
</head>
<body>
<div id="root"></div>
<div id="app-loader">
    <div class="spinner"></div>
</div>
<style>
    #app-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(2px);
    }

    #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url("https://res.cloudinary.com/exku39jb/image/upload/v1785761514/bg_gveh6h.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        z-index: 9999;
    }

    .spinner {
        width: 5rem;
        height: 5rem;
        border: 6px solid rgba(156, 39, 176, 0.2);
        border-top-color: #9c27b0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
